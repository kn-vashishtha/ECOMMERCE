spring.application.name=ecommerce

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.main.banner-mode=off
logging.level.root=warn
logging.level.org.bootcamp.ecommerce=trace
logging.level.org.bootcamp.ecommerce.services.FileService=trace
logging.level.org.springframework.security=DEBUG

#logging.level.org.hibernate.SQL=trace
# Email Configs
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.domain_name=${GMAIL_USERNAME}
security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.aes-key=${AES_SECRET_KEY}
#image
image.base_path=/home/ayush-tomar/Code/ProjectImages
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
#Admin Creds
user.admin.email=${ADMIN_EMAIL}
user.admin.password=${ADMIN_PASSWORD}